class="container mt-5" role="main"> <div class="post"> <header class="post-header"> <h1 class="post-title">gallery</h1> <p class="post-description">a selection of photos I took during my travels! for full quality pictures, contact me.</p> </header> <article> <div class="gallery"> <div class="gallery-item"> <a href="/assets/img/gallery/photo1.jpg" class="gallery-item glightbox" data-title="Mathematical Bridge at Queens' College" data-description="One of the first pictures I took coming into Cambridge as a fresh first year student.&lt;br&gt;&lt;br&gt;The Mathematical Bridge is a wooden footbridge that spans the River Cam. It's an example of geometric engineering, assembled entirely without the use of bolts or screws, just wooden joints.&lt;br&gt;&lt;br&gt;&lt;i&gt;Cambridge, Sep 2015&lt;/i&gt;"> <img src="/assets/img/gallery/photo1.jpg" alt="Mathematical Bridge at Queens' College"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo2.jpg" class="gallery-item glightbox" data-title="Phra Sri Rattana Chedi (พระศรีรัตนเจดีย์)" data-description="Taken in the Grand Palace during a tour of various temples around Bangkok! A rare shot with not many people in it since we visited right as Thailand was opening back up to international travel after COVID. (Not pictured: me dying from heat and humidity.)&lt;br&gt;&lt;br&gt;A bell-shaped Buddhist stupa constructed during Rama IV's reign. Rama V covered it with gold mosaic tiles from Italy.&lt;br&gt;&lt;br&gt;&lt;i&gt;Bangkok, Mar 2022&lt;/i&gt;"> <img src="/assets/img/gallery/photo2.jpg" alt="Phra Sri Rattana Chedi (พระศรีรัตนเจดีย์)"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo4.jpg" class="gallery-item glightbox" data-title="Hiking the Narrows" data-description="A unique hike in that you're wading through water! My favorite, partly because it was scorching outside and this was the only route that allowed some reprieve from the heat as you're in water and there's shade from the surrounding canyon walls. Highly recommend renting water shoes and a hiking stick.&lt;br&gt;&lt;br&gt;A slot canyon hike in Zion National Park in southern Utah. The trail follows the Virgin River through a narrow, winding gorge.&lt;br&gt;&lt;br&gt;&lt;i&gt;Zion National Park, Jul 2022&lt;/i&gt;"> <img src="/assets/img/gallery/photo4.jpg" alt="Hiking the Narrows"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo5.jpg" class="gallery-item glightbox" data-title="Hanalei Valley Lookout" data-description="A beautiful sunset that we witnessed off the north shore of Kauai.&lt;br&gt;&lt;br&gt;Hanalei Valley is known for its vibrant green landscape, taro fields, and stunning backdrop of towering cliffs.&lt;br&gt;&lt;br&gt;&lt;i&gt;Kauai, Aug 2022&lt;/i&gt;"> <img src="/assets/img/gallery/photo5.jpg" alt="Hanalei Valley Lookout"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo6.jpg" class="gallery-item glightbox" data-title="La Pedrera (Casa Milà)" data-description="Truly a unique architectural style! Check out the rooftop for some surreal (aka, weird-looking) chimneys.&lt;br&gt;&lt;br&gt;A modernist building by renowned architect Antoni Gaudí, Casa Milà is one of his most iconic works and a UNESCO World Heritage site. The building is known for its undulating stone façade, curved shapes, and wrought-iron balconies and windows.&lt;br&gt;&lt;br&gt;&lt;i&gt;Barcelona, Oct 2022&lt;/i&gt;"> <img src="/assets/img/gallery/photo6.jpg" alt="La Pedrera (Casa Milà)"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo7.jpg" class="gallery-item glightbox" data-title="Riad (رياض) in Marrakech" data-description="A peaceful retreat from the busy streets of Marrakech. You get welcomed with fresh mint tea as well!&lt;br&gt;&lt;br&gt;Riads are traditional Moroccan houses or palaces. The word comes from the Arabic for 'garden', reflecting the central design feature of an inner courtyard or garden surrounded by rooms. The layout is designed to provide privacy and tranquility.&lt;br&gt;&lt;br&gt;&lt;i&gt;Marrakech, Oct 2022&lt;/i&gt;"> <img src="/assets/img/gallery/photo7.jpg" alt="Riad (رياض) in Marrakech"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo3.jpg" class="gallery-item glightbox" data-title="Entrance to the Ben Youssef Madrasa (مدرسة ابن يوسف)" data-description="Some of the most stunning architecture and detailing I've ever seen.&lt;br&gt;&lt;br&gt;A historic Islamic school with stunning architecture: intricate tile work, carved cedar wood, and beautiful stucco detailing. It was a center of learning and religious life for centuries, offering instruction in Islamic law, grammar, rhetoric, and other sciences.&lt;br&gt;&lt;br&gt;&lt;i&gt;Marrakech, Oct 2022&lt;/i&gt;"> <img src="/assets/img/gallery/photo3.jpg" alt="Entrance to the Ben Youssef Madrasa (مدرسة ابن يوسف)"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo9.jpg" class="gallery-item glightbox" data-title="Sunset over the Sahara" data-description="A multi-day journey by bus with many stops along the way led us to the Sahara Desert from Marrakech. Surprisingly, there was better cell service in the desert than some parts of SF!!&lt;br&gt;&lt;br&gt;&lt;i&gt;Hassilabied, Oct 2022&lt;/i&gt;"> <img src="/assets/img/gallery/photo9.jpg" alt="Sunset over the Sahara"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo8.jpg" class="gallery-item glightbox" data-title="Nightfall in the Sahara" data-description="We rode dromedaries (separate from camels, which have two instead of just one hump!) a little bit into the desert. Once the sun started to set, we made our way over to a camp site to share a meal and rest before heading out the next day.&lt;br&gt;&lt;br&gt;&lt;i&gt;Hassilabied, Oct 2022&lt;/i&gt;"> <img src="/assets/img/gallery/photo8.jpg" alt="Nightfall in the Sahara"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo10.jpg" class="gallery-item glightbox" data-title="Streets of Chefchaouen" data-description="Day trip to Chefchaouen. Everything is blue here! Morocco is also full of stray cats milling about.&lt;br&gt;&lt;br&gt;Chefchaouen is a picturesque town nestled in the Rif Mountains and is known for its striking blue-painted buildings.&lt;br&gt;&lt;br&gt;&lt;i&gt;Chefchaouen, Oct 2022&lt;/i&gt;"> <img src="/assets/img/gallery/photo10.jpg" alt="Streets of Chefchaouen"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo11.jpg" class="gallery-item glightbox" data-title="Artanis Villa in Joshua Tree" data-description="This was an Airbnb a friend rented out for her birthday near Joshua Tree National Park! Very eclectic designs throughout the house and also had a yoga studio and tennis court on the property. Supposedly once occupied by Frank Sinatra.&lt;br&gt;&lt;br&gt;&lt;i&gt;Yucca Valley, Aug 2023&lt;/i&gt;"> <img src="/assets/img/gallery/photo11.jpg" alt="Artanis Villa in Joshua Tree"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo12.jpg" class="gallery-item glightbox" data-title="Perseids Meteor Shower in Joshua Tree" data-description="Witnessed the Perseids meteor shower while staying near Joshua Tree. I managed to get a lucky iPhone shot of a meteor trail during a long exposure shot of the night sky.&lt;br&gt;&lt;br&gt;&lt;i&gt;Yucca Valley, Aug 2023&lt;/i&gt;"> <img src="/assets/img/gallery/photo12.jpg" alt="Perseids Meteor Shower in Joshua Tree"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo13.jpg" class="gallery-item glightbox" data-title="The Ecstasy of Saint Teresa" data-description="I first learned about Bernini in high school (specifically, from the Art History portion of Academic Decathlon). I was absolutely amazed at how he managed to make hard marble look just as soft and supple as real human skin or as naturally corrugated as actual clothing folds. I made sure to see at least one of his sculptures first hand by visiting the chuch of Santa Maria della Vittoria.&lt;br&gt;&lt;br&gt;Sculpted by Gian Lorenzo Bernini, the statue depicts a mystical moment experienced by Saint Teresa of Ávila, a Spanish Carmelite nun and mystic, in which she describes an angel piercing her heart with a golden spear, causing her both intense spiritual pain and ecstasy.&lt;br&gt;&lt;br&gt;&lt;i&gt;Rome, Oct 2023&lt;/i&gt;"> <img src="/assets/img/gallery/photo13.jpg" alt="The Ecstasy of Saint Teresa"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo14.jpg" class="gallery-item glightbox" data-title="The Rape of the Sabine Women" data-description="This particular sculpture, amongst numerous others in the Piazza della Signoria, caught my eye due to its dynamic composition drawing your eyes upward. The rain that day made the scene feel even more devastating.&lt;br&gt;&lt;br&gt;Sculpted by Giambologna, the statue depicts a powerful scene from Roman mythology, where the early Romans, under the leadership of Romulus, abduct the women of the neighboring Sabine tribe to secure wives for themselves. It stands as a monumental representation of both violent conquest and the intertwining of cultures, as the eventual union between Romans and Sabines led to the founding of Rome.&lt;br&gt;&lt;br&gt;&lt;i&gt;Florence, Oct 2023&lt;/i&gt;"> <img src="/assets/img/gallery/photo14.jpg" alt="The Rape of the Sabine Women"> </a> </div> <div class="gallery-item"> <a href="/assets/img/gallery/photo15.jpg" class="gallery-item glightbox" data-title="Sunset in Oakland" data-description="Not too far from home, this hike around Oakland is a hidden secret ;) Once you're past an unassuming hill, you have an amazing view of the SF skyline as well as access to a Redwood Forest! Lots of thanks to Ben who divulged its existence to me!&lt;br&gt;&lt;br&gt;&lt;i&gt;Oakland, Sep 2024&lt;/i&gt;"> <img src="/assets/img/gallery/photo15.jpg" alt="Sunset in Oakland"> </a> </div> </div> <link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet"> <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script> <script>
