- title: Experience
  type: time_table
  contents:
    - title: Staff Research Associate III
      institution: University of California, San Francisco
      year: Sep 2019 - Current
      description: SRA in Dr. Aaron Field’s Laboratory for Orthopaedic Biomechanics and Biotransport in the Department of Orthopaedic Surgery. Characterization of chronic low back pain (Back Pain Consortium Research Program) through automatic vertebral body and paraspinal muscle segmentation, fat quantification of whole-body MRI, statistical analysis of multi-omic data, processing of whole genome sequencing data.
    - title: Summer Undergraduate Research Fellowship
      institution: University of Texas Southwestern Medical Center
      year: Jun 2016 - Aug 2017
      description: Research fellow in Dr. Qinghua Liu’s lab in the Department of Biochemistry. Studied the molecular mechanism of odor-induced innate fear mediated by Trpa1 in mice. Dissected and sectioned mouse brain tissue, modified a PCR protocol to target and produce a restriction enzyme recognition site on Trpa1, developed a method to selectively label bound proteins using biotinylation.
    - title: Research Intern
      institution: University of Texas Southwestern Medical Center
      year: Jun 2013 - Aug 2014
      description: Intern in Dr. Zhigao Wang’s lab in the Department of Molecular Biology. Studied how the herb <em>Citrullus colocynthis</em> kills cancer cells through necrosis. Developed a technique to detect phosphorylated proteins in Western blots.

